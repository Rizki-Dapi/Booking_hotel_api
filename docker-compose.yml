services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        env_file:
            - .env
        volumes:
            - storage_data:/var/www/storage
        environment:
            DB_HOST: postgres
            MONGODB_URI: mongodb://mongo:27017
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            mongo:
                condition: service_started
            redis:
                condition: service_started

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - storage_data:/var/www/storage
        depends_on:
            - app

    queue:
        build:
            context: .
            dockerfile: docker/Dockerfile

        # ADDED: queue juga membutuhkan konfigurasi dari .env
        env_file:
            - .env

        command: php artisan queue:work --tries=3 --backoff=5
        volumes:
            - storage_data:/var/www/storage
        environment:
            DB_HOST: postgres
            MONGODB_URI: mongodb://mongo:27017
            REDIS_HOST: redis
        depends_on:
            - app

    scheduler:
        build:
            context: .
            dockerfile: docker/Dockerfile

        # ADDED: scheduler juga membutuhkan konfigurasi dari .env
        env_file:
            - .env

        command: >
            sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        volumes:
            - storage_data:/var/www/storage
        environment:
            DB_HOST: postgres
            MONGODB_URI: mongodb://mongo:27017
            REDIS_HOST: redis
        depends_on:
            - app

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: bookinig-hotel
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: laravel
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    mongo:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

volumes:
    postgres_data:
    mongo_data:
    storage_data:
